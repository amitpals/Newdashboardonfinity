<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Invoice Header Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="purchase-header-panel" aria-label="Purchase Invoice Header Panel">
      <div class="purchase-header-panel__surface">
        <div class="purchase-header-panel__identity">
          <div class="purchase-header-panel__identity-row">
            <p class="purchase-header-panel__vendor">Vertex Cloud Ltd.</p>
            <p class="purchase-header-panel__meta">Kevin Hughes</p>
            <p class="purchase-header-panel__meta">kevin.hughes@vertexcloud.com</p>
          </div>
          <p class="purchase-header-panel__subline">PIN-1888 • $ 19,400.00 • Due 20 May 2026</p>
        </div>

        <div class="purchase-header-panel__actions">
          <button class="action-button action-button--primary" type="button">Save Draft</button>
          <button class="action-button action-button--secondary" type="button">Submit Invoice</button>
          <button class="action-button action-button--secondary" type="button">Attach Bill</button>
          <button class="action-button action-button--secondary" type="button">Match PO</button>
        </div>
      </div>
    </section>
  </body>
</html>
