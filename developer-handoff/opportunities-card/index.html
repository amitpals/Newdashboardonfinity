<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opportunities Card</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo">
      <section class="card-list">
        <button class="opportunity-card opportunity-card--selected" type="button">
          <span class="opportunity-card__overlay" aria-hidden="true"></span>
          <span class="opportunity-card__rail" aria-hidden="true"></span>

          <div class="opportunity-card__top">
            <h3 class="opportunity-card__title">Apex Modernization</h3>
            <div class="opportunity-card__top-actions">
              <span class="opportunity-card__stage">Proposal</span>
              <span class="opportunity-card__edit" aria-hidden="true">
                <svg viewBox="0 0 18 18" fill="none">
                  <path d="M11.9 3.2L14.8 6.1M4 14l2.6-.5 7.3-7.3a1.2 1.2 0 0 0 0-1.7l-.4-.4a1.2 1.2 0 0 0-1.7 0L4.5 11.4 4 14Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
          </div>

          <p class="opportunity-card__company">Apex Med Systems</p>

          <div class="opportunity-card__meta">
            <p class="opportunity-card__amount">$ 124,000</p>
            <p class="opportunity-card__owner">Mack Rod</p>
          </div>
        </button>

        <button class="opportunity-card" type="button">
          <div class="opportunity-card__top">
            <h3 class="opportunity-card__title">DK Industries Platform v3</h3>
            <div class="opportunity-card__top-actions">
              <span class="opportunity-card__stage">Negotiation</span>
              <span class="opportunity-card__edit" aria-hidden="true">
                <svg viewBox="0 0 18 18" fill="none">
                  <path d="M11.9 3.2L14.8 6.1M4 14l2.6-.5 7.3-7.3a1.2 1.2 0 0 0 0-1.7l-.4-.4a1.2 1.2 0 0 0-1.7 0L4.5 11.4 4 14Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
          </div>

          <p class="opportunity-card__company">DK Industries</p>

          <div class="opportunity-card__meta">
            <p class="opportunity-card__amount">$ 79,000</p>
            <p class="opportunity-card__owner">Jacob M.</p>
          </div>
        </button>
      </section>
    </main>
  </body>
</html>
